nodeLinker: node-modules

# Hold packages published less than 2 days ago. Yarn counts in minutes (2880 = 2 days), which also
# behaves the same on yarn versions that do not parse durations such as `2d`.
npmMinimalAgeGate: 2880

# Contentful's own packages are exempt so a fresh release of one is not held back.
npmPreapprovedPackages:
  - '@contentful/*'

# Lifecycle (build) scripts of dependencies do not run on install.
enableScripts: false

# Yarn does not read .npmrc, so the private registry and its read token are configured here.
npmScopes:
  contentful:
    npmAlwaysAuth: true
    npmAuthToken: '${GITHUB_TOKEN:-}'
    npmRegistryServer: 'https://npm.pkg.github.com'
